---
layout: default
---
<article>
  <p class="back"><a href="{{ page.collection | prepend: '/' | append: '/' | relative_url }}">&larr; {{ page.collection | capitalize }}</a></p>
  <h1>{{ page.title }}</h1>
  {% if page.date %}<p class="meta">{{ page.date | date: "%B %-d, %Y" }}</p>{% endif %}

  {{ content }}

  {% if page.tags and page.tags.size > 0 %}
  <p class="tags">
    {% for t in page.tags %}<a href="{{ '/tags/' | relative_url }}#{{ t | slugify }}">#{{ t }}</a> {% endfor %}
  </p>
  {% endif %}
</article>
